<svg width="512" height="512" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Forme principale : Un Hexagone robuste (Le Registre / La Structure) -->
<!-- On utilise des traits très épais (8px) pour la visibilité -->
<path d="M50 10L85 30V70L50 90L15 70V30L50 10Z"
stroke="#6366F1"
stroke-width="8"
stroke-linejoin="round"/>

<!-- Élément central : Le disque ISO / Le cœur de donnée -->

<!-- Couleur Violette vive pour le contraste -->

<circle cx="50" cy="42" r="12" fill="#A855F7"/>

<!-- L'accent de sécurité / Le "i" d'ISO -->

<!-- Une barre verticale simple qui complète la forme -->

<rect x="46" y="62" width="8" height="15" rx="4" fill="#A855F7"/>

<!-- Petit point lumineux pour le côté "Tech/Serveur" -->

<circle cx="50" cy="42" r="4" fill="white" fill-opacity="0.5"/>
</svg>