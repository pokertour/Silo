name: Build and Push Docker Image

on:
  # Publication en poussant un tag : git tag v1.2.0 && git push origin v1.2.0
  push:
    tags:
      - 'v*'

  # Publication manuelle depuis l'onglet Actions de GitHub (« Run workflow »)
  workflow_dispatch:
    inputs:
      version:
        description: 'Version à publier (ex. v1.2.0 ou v1.3.0-beta.1)'
        required: true
        type: string
      latest:
        description: 'Mettre aussi à jour le tag « latest » (ignoré pour une pré-version)'
        required: false
        default: true
        type: boolean
      release:
        description: 'Créer le tag git et la release GitHub correspondants'
        required: false
        default: true
        type: boolean

concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      IMAGE: ghcr.io/${{ github.repository_owner }}/silo
    permissions:
      contents: write # création du tag git et de la release (publication manuelle)
      packages: write # publication de l'image sur GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Les entrées passent par des variables d'environnement (jamais interpolées
      # directement dans le script) pour éviter toute injection de commande.
      - name: Resolve version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_LATEST: ${{ inputs.latest }}
          INPUT_RELEASE: ${{ inputs.release }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            LATEST="$INPUT_LATEST"
            RELEASE="$INPUT_RELEASE"
          else
            VERSION="$REF_NAME"
            LATEST=true
            RELEASE=false # le tag existe déjà
          fi

          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Version invalide « $VERSION » : format attendu vX.Y.Z ou vX.Y.Z-suffixe (ex. v1.2.0, v1.3.0-beta.1)."
            exit 1
          fi

          # Pré-version (ex. v1.3.0-beta.1) : jamais publiée comme « latest »
          PRERELEASE=false
          case "$VERSION" in *-*) PRERELEASE=true; LATEST=false ;; esac

          if [ "$RELEASE" = "true" ] && git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Le tag $VERSION existe déjà. Choisissez une autre version ou décochez « release »."
            exit 1
          fi

          {
            echo "version=$VERSION"
            echo "latest=$LATEST"
            echo "release=$RELEASE"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Publication de $VERSION"
            echo "- Image : \`$IMAGE:$VERSION\`"
            echo "- latest : $LATEST · release GitHub : $RELEASE · pré-version : $PRERELEASE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.latest == 'true' && format('{0}:latest', env.IMAGE) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Créé seulement après la publication de l'image : un build en échec ne
      # laisse pas de tag orphelin. Un tag créé avec GITHUB_TOKEN ne relance pas
      # ce workflow (pas de double publication).
      - name: Create git tag and GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          FLAGS="--generate-notes --target $GITHUB_SHA"
          if [ "$PRERELEASE" = "true" ]; then FLAGS="$FLAGS --prerelease"; fi
          gh release create "$VERSION" --title "$VERSION" $FLAGS
