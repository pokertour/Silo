name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      packages: write # Indispensable pour avoir le droit d'écrire l'image

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # GitHub génère ce token temporaire tout seul !

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          # Le nom de l'image sera : ghcr.io/pokertour/silo:latest
          tags: |
            ghcr.io/${{ github.repository_owner }}/silo:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/silo:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
