[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:frankenphp]
command=frankenphp run --config /app/Caddyfile
user=root
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:redis]
; Données persistées dans le volume storage : sessions et file d'attente survivent aux mises à jour
command=redis-server --dir /app/storage/redis --appendonly yes --save 60 1
user=root
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=php /app/artisan schedule:work
user=root
autostart=true
autorestart=true
stdout_logfile=/app/storage/logs/scheduler.log
stderr_logfile=/app/storage/logs/scheduler.error.log

[program:worker]
command=php /app/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
user=root
autostart=true
autorestart=true
stdout_logfile=/app/storage/logs/worker.log
stderr_logfile=/app/storage/logs/worker.error.log
